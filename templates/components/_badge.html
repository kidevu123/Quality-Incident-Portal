{% comment %}
Generic small label / chip.
Usage: {% include "components/_badge.html" with label="Beta" variant="brand" %}
Variants: neutral (default) | brand | success | warning | danger | info
{% endcomment %}{% spaceless %}
<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium
{% if variant == 'brand' %}bg-violet-100 text-violet-800 dark:bg-violet-950/50 dark:text-violet-200
{% elif variant == 'success' %}bg-emerald-100 text-emerald-800 dark:bg-emerald-950/40 dark:text-emerald-200
{% elif variant == 'warning' %}bg-amber-100 text-amber-900 dark:bg-amber-950/40 dark:text-amber-200
{% elif variant == 'danger' %}bg-rose-100 text-rose-800 dark:bg-rose-950/40 dark:text-rose-200
{% elif variant == 'info' %}bg-sky-100 text-sky-800 dark:bg-sky-950/40 dark:text-sky-200
{% else %}bg-zinc-100 text-zinc-700 dark:bg-zinc-800 dark:text-zinc-200
{% endif %}">{{ label }}</span>
{% endspaceless %}
