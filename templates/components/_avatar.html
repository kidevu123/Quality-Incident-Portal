{% comment %}
Initial-letter avatar.
Usage: {% include "components/_avatar.html" with name=user.username size="md" %}
{% endcomment %}{% spaceless %}
<span class="inline-flex shrink-0 items-center justify-center rounded-full bg-violet-100 font-semibold text-violet-700 dark:bg-violet-950/50 dark:text-violet-200
{% if size == 'sm' %} h-7 w-7 text-xs
{% elif size == 'lg' %} h-12 w-12 text-base
{% else %} h-9 w-9 text-sm
{% endif %}">{{ name|slice:":1"|upper|default:"?" }}</span>
{% endspaceless %}
